#@TYPE: Machine
#@NAME: Next Thing Co. C.H.I.P.
#@DESCRIPTION: Machine configuration for the Next Thing Co. C.H.I.P. single board computer ($9 board)

DEFAULTTUNE ?= "cortexa8hf-neon"
require conf/machine/include/arm/armv7a/tune-cortexa8.inc

# Hardware / SoC Family
SOC_FAMILY = "sun5i"

# Kernel Configuration
PREFERRED_PROVIDER_virtual/kernel ?= "linux-chip"
PREFERRED_VERSION_linux-chip ?= "6.6%"
KERNEL_IMAGETYPE = "zImage"
KERNEL_DEVICETREE = "allwinner/sun5i-r8-chip.dtb"

# Bootloader Configuration
PREFERRED_PROVIDER_virtual/bootloader ?= "u-boot-chip"
PREFERRED_PROVIDER_u-boot ?= "u-boot-chip"
PREFERRED_VERSION_u-boot-chip ?= "2024.01%"

UBOOT_MACHINE = "CHIP_defconfig"
UBOOT_BINARY = "u-boot-sunxi-with-spl.bin"
SPL_BINARY = "sunxi-spl.bin"

# U-Boot Boot Script
UBOOT_ENTRYPOINT = "0x40008000"
UBOOT_LOADADDRESS = "0x40008000"
UBOOT_ENV = "boot"
UBOOT_ENV_SUFFIX = "scr"

# Serial Console (UART0 on headers TX/RX, pin 3/5 on U13)
SERIAL_CONSOLES ?= "115200;ttyS0"

# Features & Extra Packages
MACHINE_FEATURES = "kernel26 apm usbgadget usbhost vfat ext4 screen wifi bluetooth alsa"
MACHINE_EXTRA_RRECOMMENDS += " \
    kernel-modules \
    linux-firmware-rtl8723 \
    linux-firmware-rtl_bt \
"

# Filesystem & Storage Configuration
# Supports both USB rootfs (ext4/tar.gz) and Onboard Raw NAND (ubi)
IMAGE_FSTYPES ?= "tar.gz ext4 ubi"

# C.H.I.P. Raw NAND UBI Geometry (SLC/MLC)
# Page size: 16KB, LEB size: 2064384, PEB size: 2097152
CHIP_UBI_PAGE_SIZE ?= "16384"
MKUBIFS_ARGS ?= "-m ${CHIP_UBI_PAGE_SIZE} -e 2064384 -c 2000"
UBINIZE_ARGS ?= "-m ${CHIP_UBI_PAGE_SIZE} -p 2097152 -s ${CHIP_UBI_PAGE_SIZE}"
UBI_VOLNAME ?= "rootfs"
